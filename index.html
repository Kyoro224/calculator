<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ▼ タイトルと説明文の追加・変更 ▼ -->
    <title>埋め込める！シンプル電卓</title>
    <meta name="description" content="ブログやWebサイトに簡単に埋め込める、おしゃれで使いやすいシンプルな電卓です。スマホ対応でサクサク計算できます。">
    
    <!-- SNSシェア時のプレビュー表示用（OGP）もおまけで追加 -->
    <meta property="og:title" content="埋め込める！シンプル電卓">
    <meta property="og:description" content="ブログやWebサイトに簡単に埋め込める、おしゃれで使いやすいシンプルな電卓です。">
    <meta property="og:type" content="website">

    <style>
        :root {
            --primary-color: #6577B3;
            --primary-hover: #54649b;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --btn-bg: #f3f4f6;
            --btn-hover: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 320px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .header-links {
            display: flex;
            gap: 5px;
        }

        .header-link-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 0.7rem;
            color: var(--primary-color);
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .header-link-btn:hover {
            background-color: #f3f4f6;
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 1.8rem;
            text-align: right;
            padding: 0 16px;
            outline: none;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }

        .btn {
            aspect-ratio: 1 / 1;
            font-size: 1.1rem;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            color: var(--text-color);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn-zero {
            grid-column: span 2;
            aspect-ratio: auto;
            height: 100%;
        }

        .btn.operator {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn.operator:hover {
            background-color: var(--primary-hover);
        }

        .btn.function {
            background-color: #e5e7eb;
            color: #4b5563;
        }

        .btn.function:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="header-top">
            <span>電卓</span>
            <div class="header-links">
                <a href="https://kyoro224.github.io/developer/" class="header-link-btn">👤 開発者情報</a>
                <a href="privacy.html" class="header-link-btn">🔒 ポリシー</a>
                <a href="embed.html" class="header-link-btn">埋め込み</a>
            </div>
        </div>

        <input type="text" id="display" readonly value="0">
        
        <div class="buttons">
            <button class="btn function" onclick="clearDisplay()">AC</button>
            <button class="btn function" onclick="deleteChar()">←</button>
            <button class="btn function" onclick="appendValue('%')">%</button>
            <button class="btn operator" onclick="appendValue('÷')">÷</button>
            
            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('×')">×</button>
            
            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>
            
            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>
            
            <button class="btn btn-zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(val) {
            if (display.value === '0' && val !== '.') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay() {
            display.value = '0';
        }

        function deleteChar() {
            display.value = display.value.slice(0, -1);
            if (display.value === '') {
                display.value = '0';
            }
        }

        function calculate() {
            try {
                let expression = display.value
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/%/g, '/100');
                
                display.value = eval(expression);
            } catch (error) {
                display.value = 'エラー';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>
</body>
</html>
